name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check
        env:
          GEMINI_API_KEY: dummy-key-for-ci

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/jft04/eece-430-assignment6:latest .

      - name: Push Docker image
        run: docker push ghcr.io/jft04/eece-430-assignment6:latest

  deploy:
    needs: test
    runs-on: [self-hosted, "AI Agent-deploy"]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check Docker on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: docker info

      - name: Check Docker on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: docker info

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: docker pull --platform linux/amd64 ghcr.io/jft04/eece-430-assignment6:latest

      - name: Pull image on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: docker pull --platform linux/amd64 ghcr.io/jft04/eece-430-assignment6:latest